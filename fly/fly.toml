# fly.toml app configuration file generated for open-abap-xtt on 2026-09-08T15:33:03+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Deploy from the repo root (fly.cmd does this):
#   fly\fly.cmd
#
# Docker build context is the repo root; this file only lives under fly/.

app = 'open-abap-xtt'
primary_region = 'iad'

[build]
  dockerfile = "fly/Dockerfile"
  ignorefile = "fly/.dockerignore"

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
