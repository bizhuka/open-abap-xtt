<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XTT Demo Generator</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --bg-elev: #171e27;
      --card: #1c2430;
      --line: #2c394a;
      --text: #e8eef6;
      --muted: #93a4b8;
      --accent: #3d9cf0;
      --accent-2: #6ee7b7;
      --danger: #fb7185;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(61, 156, 240, 0.18), transparent 50%),
        radial-gradient(900px 400px at 100% 0%, rgba(110, 231, 183, 0.12), transparent 40%),
        var(--bg);
    }

    #app { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }

    .card {
      width: min(720px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 28%), var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.03em; }
    p.lead { margin: 0 0 24px; color: var(--muted); }

    form { display: grid; gap: 16px; }
    label { display: grid; gap: 8px; font-size: 0.92rem; color: var(--muted); }
    label span { color: var(--text); font-weight: 600; }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 156, 240, 0.2);
    }

    .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

    button {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 700;
      color: #061018;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }

    .status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 0.92rem; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--accent-2); }
  </style>
</head>
<body>
  <div id="app">
    <main class="card">
      <h1>XTT report generator</h1>
      <p class="lead">Choose an example, optional counts, and a template. The ABAP demo class builds the file.</p>

      <form @submit.prevent="generate">
        <label>
          <span>Example</span>
          <select v-model="example" required>
            <option disabled value="">Select an example</option>
            <option v-for="item in examples" :key="item.ind" :value="item.ind">
              {{ item.ind }} — {{ item.desc }}
            </option>
          </select>
        </label>

        <div class="counts">
          <label v-if="meta.row_count">
            <span>Row count (mv_r_cnt)</span>
            <input v-model.number="mv_r_cnt" type="number" min="1" max="25" required />
          </label>
          <label v-if="meta.colum_count">
            <span>Column count (mv_c_cnt)</span>
            <input v-model.number="mv_c_cnt" type="number" min="1" max="3" required />
          </label>
          <label v-if="meta.block_count">
            <span>Block count (mv_b_cnt)</span>
            <input v-model.number="mv_b_cnt" type="number" min="1" max="3" required />
          </label>
        </div>

        <label v-if="example">
          <span>Template</span>
          <select v-model="template" required>
            <option disabled value="">Select a template</option>
            <option v-for="item in meta.templates" :key="item.objid" :value="item.objid">
              {{ item.objid }}
            </option>
          </select>
        </label>

        <button type="submit" :disabled="busy || !example || !template">
          {{ busy ? "Generating…" : "Generate report" }}
        </button>
        <p class="status" :class="statusClass">{{ message }}</p>
      </form>
    </main>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          examples: [],
          example: "",
          template: "",
          mv_r_cnt: 15,
          mv_c_cnt: 3,
          mv_b_cnt: 3,
          meta: { row_count: false, colum_count: false, block_count: false, templates: [] },
          busy: false,
          message: "",
          statusClass: "",
        };
      },
      watch: {
        example: "loadMeta",
      },
      async mounted() {
        const response = await fetch("/api/examples");
        this.examples = await response.json();
      },
      methods: {
        inRange(value, min, max) {
          return Number.isInteger(value) && value >= min && value <= max;
        },
        async loadMeta() {
          this.template = "";
          this.meta = { row_count: false, colum_count: false, block_count: false, templates: [] };
          this.message = "";
          if (!this.example) {
            return;
          }
          const response = await fetch("/api/example?ind=" + encodeURIComponent(this.example));
          const payload = await response.json();
          if (!response.ok) {
            this.message = payload.error || "Cannot load example";
            this.statusClass = "error";
            return;
          }
          this.meta = payload;
          this.mv_r_cnt = 15;
          this.mv_c_cnt = 3;
          this.mv_b_cnt = 3;
          if (payload.templates.length === 1) {
            this.template = payload.templates[0].objid;
          }
        },
        async generate() {
          if (this.meta.row_count && !this.inRange(this.mv_r_cnt, 1, 25)) {
            this.message = "Row count must be between 1 and 25";
            this.statusClass = "error";
            return;
          }
          if (this.meta.colum_count && !this.inRange(this.mv_c_cnt, 1, 3)) {
            this.message = "Column count must be between 1 and 3";
            this.statusClass = "error";
            return;
          }
          if (this.meta.block_count && !this.inRange(this.mv_b_cnt, 1, 3)) {
            this.message = "Block count must be between 1 and 3";
            this.statusClass = "error";
            return;
          }

          this.busy = true;
          this.message = "Generating…";
          this.statusClass = "";
          try {
            const response = await fetch("/api/generate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                example: this.example,
                template: this.template,
                mv_r_cnt: this.meta.row_count ? this.mv_r_cnt : 15,
                mv_c_cnt: this.meta.colum_count ? this.mv_c_cnt : 3,
                mv_b_cnt: this.meta.block_count ? this.mv_b_cnt : 3,
              }),
            });

            if (!response.ok) {
              let error = "Generate failed";
              try {
                const payload = await response.json();
                error = payload.error || error;
              } catch {
                error = await response.text() || error;
              }
              this.message = error;
              this.statusClass = "error";
              return;
            }

            const blob = await response.blob();
            const disposition = response.headers.get("Content-Disposition") || "";
            const match = disposition.match(/filename="([^"]+)"/);
            const filename = match ? match[1] : "report.bin";
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);
            this.message = "Downloaded " + filename;
            this.statusClass = "ok";
          } catch (error) {
            this.message = error.message || String(error);
            this.statusClass = "error";
          } finally {
            this.busy = false;
          }
        },
      },
    }).mount("#app");
  </script>
</body>
</html>
